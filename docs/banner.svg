<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Meeting Minutes Generator banner">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f8fa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="280" fill="url(#bg)"/>
  <g transform="translate(80,60)" font-family="Segoe UI, Roboto, Arial" fill="#1f2937">
    <!-- Icon: clipboard with checkmarks -->
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="140" height="160" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
      <rect x="40" y="-20" width="60" height="40" rx="8" fill="#e5e7eb" stroke="#cbd5e1"/>
      <rect x="16" y="36" width="108" height="12" rx="6" fill="#e5e7eb"/>
      <rect x="16" y="68" width="84" height="12" rx="6" fill="#e5e7eb"/>
      <rect x="16" y="100" width="98" height="12" rx="6" fill="#e5e7eb"/>
      <!-- Checkmarks -->
      <path d="M20 132 l8 8 l16 -16" stroke="#16a34a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M20 156 l8 8 l16 -16" stroke="#16a34a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(200,15)">
      <text font-size="40" font-weight="700">Meeting Minutes Generator</text>
      <text y="56" font-size="20" fill="#374151">Turn raw transcripts into clean, action-oriented minutes.</text>
    </g>
  </g>
</svg>


